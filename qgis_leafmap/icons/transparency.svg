<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.2" />
    </linearGradient>
    <!-- Checkerboard pattern for transparency -->
    <pattern id="checkerboard" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="4" fill="#CCCCCC"/>
      <rect x="4" y="4" width="4" height="4" fill="#CCCCCC"/>
      <rect x="0" y="4" width="4" height="4" fill="#FFFFFF"/>
      <rect x="4" y="0" width="4" height="4" fill="#FFFFFF"/>
    </pattern>
  </defs>
  <!-- Background with checkerboard -->
  <rect x="6" y="14" width="52" height="36" rx="4" fill="url(#checkerboard)"/>
  <!-- Gradient overlay showing transparency effect -->
  <rect x="6" y="14" width="52" height="36" rx="4" fill="url(#transGrad)"/>
  <!-- Frame -->
  <rect x="6" y="14" width="52" height="36" rx="4" fill="none" stroke="#1565C0" stroke-width="2"/>
  <!-- Slider track -->
  <rect x="10" y="54" width="44" height="4" rx="2" fill="#E0E0E0"/>
  <!-- Slider fill -->
  <rect x="10" y="54" width="28" height="4" rx="2" fill="#42A5F5"/>
  <!-- Slider handle -->
  <circle cx="38" cy="56" r="5" fill="#1565C0" stroke="white" stroke-width="2"/>
  <!-- Percentage labels -->
  <text x="10" y="10" font-family="Arial" font-size="8" fill="#666">100%</text>
  <text x="48" y="10" font-family="Arial" font-size="8" fill="#666">0%</text>
</svg>
